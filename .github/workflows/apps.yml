name: Build Android + Windows apps
# `main` builds the real Board (latest release, tags v0.2.N).
# `dev` builds Board Dev: its own app ids and database (scripts/use-env.mjs), published as a pre-release tagged
# dev-v0.2.N so "latest" always stays the real Board. Dev numbers start at 100 above the run number, so they stay
# above the builds the old board-dev repo shipped (up to 0.2.14) and install as updates.
on:
  push:
    branches: [main, dev]
    paths: ['web/**', 'android/**', 'src-tauri/**', 'extension/**', 'scripts/use-env.mjs', '.github/workflows/apps.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: 'apps-${{ github.ref_name }}', cancel-in-progress: true }
env:
  APP_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  NUMBER_OFFSET: ${{ github.ref_name == 'dev' && 100 || 0 }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing key check
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets not set — skipping the APK so you never install an app signed with a throwaway key."
      - name: Use ${{ env.APP_ENV }} settings
        run: node scripts/use-env.mjs "$APP_ENV"
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Build web assets and sync into Android
        if: env.HAS_KEY == 'true'
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          node ../scripts/use-env.mjs check "$APP_ENV" dist
          npx cap sync android
      - name: Build signed APK
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: board
        run: |
          export BUILD_NUMBER=$(( ${{ github.run_number }} + NUMBER_OFFSET ))
          # Strip stray CR/LF/spaces (secrets set from Windows can pick up a trailing CRLF).
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/board.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PW" | tr -d '\r\n')"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/board.jks"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Board-android.apk"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with: { name: android, path: Board-android.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Use ${{ env.APP_ENV }} settings
        run: node scripts/use-env.mjs $env:APP_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
          node ../scripts/use-env.mjs check $env:APP_ENV dist
      - name: Build Windows installer
        shell: pwsh
        run: |
          $n = ${{ github.run_number }} + [int]$env:NUMBER_OFFSET
          "{`"version`":`"0.2.$n`"}" | Out-File -Encoding ascii version.json
          npx --prefix web tauri build --config version.json
      - name: Collect installers
        shell: pwsh
        run: |
          $b = "src-tauri/target/release/bundle"
          Copy-Item (Get-ChildItem "$b/nsis/*.exe" | Select-Object -First 1).FullName "Board-windows-setup.exe"
          Copy-Item (Get-ChildItem "$b/msi/*.msi" | Select-Object -First 1).FullName "Board-windows.msi"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'Board-windows*' }

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use ${{ env.APP_ENV }} settings
        run: |
          node scripts/use-env.mjs "$APP_ENV"
          node scripts/use-env.mjs check "$APP_ENV" extension
      - name: Zip extension
        working-directory: extension
        run: zip -r "$GITHUB_WORKSPACE/Board-extension.zip" . -x '.*'
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: Board-extension.zip }

  release:
    needs: [android, windows, extension]
    # Only main and dev publish; a manual run on any other branch just builds.
    if: always() && needs.windows.result == 'success' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - id: v
        run: |
          n=$(( ${{ github.run_number }} + NUMBER_OFFSET ))
          if [ "$APP_ENV" = dev ]; then
            echo "tag=dev-v0.2.$n" >> "$GITHUB_OUTPUT"; echo "name=Board Dev 0.2.$n" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.2.$n" >> "$GITHUB_OUTPUT"; echo "name=Board 0.2.$n" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.v.outputs.name }}
          prerelease: ${{ env.APP_ENV == 'dev' }}
          make_latest: ${{ env.APP_ENV == 'dev' && 'false' || 'true' }}
          body: |
            ${{ env.APP_ENV == 'dev' && '**This is the DEV build.** It installs next to the real Board (as "Board Dev") and uses its own separate database. Web version: https://nzimmer-apps.github.io/board/dev/' || 'Web version: https://nzimmer-apps.github.io/board/' }}
            **Android:** download `Board-android.apk` on your phone and open it (allow "install unknown apps" for your browser the first time). Later versions install over the top — no need to uninstall.
            **Chrome/Arc extension:** unzip `Board-extension.zip`, open `chrome://extensions`, turn on Developer mode → **Load unpacked** → pick the unzipped folder.
            **Windows:** run `Board-windows-setup.exe`. It's unsigned, so SmartScreen may say "Windows protected your PC" → **More info → Run anyway**. ${{ env.APP_ENV == 'dev' && 'Ctrl+Alt+D' || 'Ctrl+Alt+B' }} opens quick-add from anywhere; closing the window keeps it in the tray.
          files: out/*
