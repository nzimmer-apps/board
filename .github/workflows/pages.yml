name: Deploy web app to GitHub Pages
# One Pages site holds both apps: the real Board from `main` at /board/ and Board Dev from `dev` at /board/dev/.
# A deploy replaces the whole site, so a push to either branch rebuilds both.
on:
  push:
    branches: [main, dev]
    paths: ['web/**', 'scripts/use-env.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: prod }
      - uses: actions/checkout@v4
        with: { ref: dev, path: dev }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '*/web/package-lock.json' }
      - name: Build the real Board (main)
        working-directory: prod/web
        env: { BASE: '/${{ github.event.repository.name }}/' }
        run: |
          npm ci
          npm test
          npm run build
      - name: Build Board Dev (dev)
        working-directory: dev
        env: { BASE: '/${{ github.event.repository.name }}/dev/' }
        run: |
          node scripts/use-env.mjs dev
          cd web
          npm ci
          npm test
          npm run build
      - name: Check each app talks to its own database
        run: |
          node dev/scripts/use-env.mjs check prod prod/web/dist
          node dev/scripts/use-env.mjs check dev dev/web/dist
      - name: Put both apps in one site
        run: |
          mkdir site
          cp -r prod/web/dist/. site/
          mkdir site/dev
          cp -r dev/web/dist/. site/dev/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
